services:
  kounga_erp.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      #- ConnectionStrings__Database=Server=postgresdb;port=5432;Database=koungadb;User Id=postgres;Password=postgres;Include Error Detail=true
      - ConnectionStrings__Database=Server=sqlserver;Database=koungadb;User Id=sa;Password=!0<.8t0d35_M;;Encrypt=False;TrustServerCertificate=True;
    depends_on:
      - database
    ports:
      - "6001:8080"
      - "6061:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
  
  database:
    container_name: postgresdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=koungadb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgresdb:/var/lib/postgresql
  
  sqlserver:
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "!0<.8t0d35_M"
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql

  pgadmin:
    ports:
      - 5050:80
    environment:
      # Required by pgAdmin
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret